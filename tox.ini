[tox]
envlist = py3{9,10,11,12,13},lint,type

[testenv]
skip_install = true
# Version constraints are in pyproject.toml [project.optional-dependencies]
deps =
    bibtexparser
    pyzotero
    requests
    urllib3
    pytest
    pytest-cov
    pytest-mock
    responses
description = Run unit and integration tests
commands =
    pytest {posargs:tests/}

[testenv:py3]
# Generic py3 environment for quick testing with current Python
description = Run tests with current Python 3 version

[testenv:cov]
skip_install = true
deps = {[testenv]deps}
description = Run tests with coverage reporting (HTML + XML for CI)
commands =
    pytest --cov=code --cov-report=html --cov-report=xml --cov-report=term-missing {posargs:tests/}

[testenv:lint]
skip_install = true
deps = ruff
description = Run code quality checks
commands =
    ruff check code/ tests/

[testenv:type]
skip_install = true
deps =
    mypy
    types-requests
description = Run type checking with mypy
commands =
    mypy --install-types --non-interactive code/

[testenv:integration]
skip_install = true
deps = {[testenv]deps}
description = Run integration tests only
commands =
    pytest -v -m integration {posargs:tests/}

[testenv:unit]
skip_install = true
deps = {[testenv]deps}
description = Run unit tests only
commands =
    pytest -v -m "not integration" {posargs:tests/}

[gh-actions]
# Map GitHub Actions Python versions to tox environments
# Python 3.11 also runs lint, type checking, and coverage
python =
    3.9: py39
    3.10: py310
    3.11: py311, lint, type, cov
    3.12: py312
    3.13: py313
