[tox]
envlist = py3{10,11,12,13,14},lint,type

[testenv]
skip_install = true
# Install from pyproject.toml extras (skip_install=true because code/ has no .py files)
deps = .[test]
description = Run unit and integration tests
commands =
    pytest {posargs:tests/}

[testenv:py3]
# Generic py3 environment for quick testing with current Python
description = Run tests with current Python 3 version

[testenv:cov]
skip_install = true
deps = .[test]
description = Run tests with coverage reporting (HTML + XML for CI)
commands =
    pytest --cov=code --cov-report=html --cov-report=xml --cov-report=term-missing {posargs:tests/}

[testenv:lint]
skip_install = true
deps = .[devel]
description = Run code quality checks
commands =
    ruff check code/ tests/

[testenv:type]
skip_install = true
deps = .[devel]
description = Run type checking with mypy
commands =
    # Note: code/ scripts don't have .py extension, so we only type-check tests/
    mypy --ignore-missing-imports tests/

[testenv:integration]
skip_install = true
deps = .[test]
description = Run integration tests only
commands =
    pytest -v -m integration {posargs:tests/}

[testenv:unit]
skip_install = true
deps = .[test]
description = Run unit tests only
commands =
    pytest -v -m "not integration" {posargs:tests/}

[gh-actions]
# Map GitHub Actions Python versions to tox environments
# Python 3.12 also runs lint, type checking, and coverage
python =
    3.10: py310
    3.11: py311
    3.12: py312, lint, type, cov
    3.13: py313
    3.14: py314
