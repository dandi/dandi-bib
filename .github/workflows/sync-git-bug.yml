# One-way sync: GitHub Issues → git-bug (stored as refs/bugs/* and
# refs/identities/* in this repo).
#
# Pushing local git-bug issues back to GitHub is not yet possible with
# a single CI token -- git-bug's exporter requires the original author's
# own token and the GitHub API does not allow creating issues on behalf
# of another user.  See https://github.com/git-bug/git-bug/issues/1501
#
# Local setup (one-time, after cloning):
#
#   # Install git-bug: https://github.com/git-bug/git-bug/releases
#   # Then fetch synced data and adopt your identity:
#
#   git fetch origin 'refs/identities/*:refs/identities/*' \
#                     'refs/bugs/*:refs/bugs/*'
#   git-bug user              # list available identities
#   git-bug user adopt <ID>   # adopt yours (match by GitHub login)
#   git-bug tui               # browse issues
---
name: Sync git-bug issues from GitHub

on:
  schedule:
    # Run hourly at minute 17 (avoid top-of-hour contention)
    - cron: "17 * * * *"
  issues:
    types: [opened, edited, deleted, closed, reopened, labeled, unlabeled]
  issue_comment:
    types: [created, edited, deleted]
  workflow_dispatch:

# Coalesce bursts: at most one run active + one queued.  The queued run
# picks up all changes accumulated since the active run started.
concurrency:
  group: sync-git-bug
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    # Only run in the upstream repo, not in forks
    if: ${{ !github.event.repository.fork }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Fetch git-bug refs so we can push incremental updates
          fetch-depth: 0

      - name: Configure git identity
        run: |
          # Required by git-bug's go-git internals (see git-bug#1475),
          # NOT for creating a git-bug identity.
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@users.noreply.github.com"

      - name: Fetch existing git-bug refs
        run: |
          # Fetch both bugs and identities BEFORE configuring the bridge.
          # bridge new's FinishConfig() looks up identities by GitHub login
          # metadata -- if identity refs are already present it reuses them
          # instead of creating a new identity each run.
          git fetch origin 'refs/identities/*:refs/identities/*' || true
          git fetch origin 'refs/bugs/*:refs/bugs/*' || true
          # Invalidate cache so git-bug picks up freshly fetched refs
          rm -rf .git/git-bug/cache

      - name: Install git-bug
        run: |
          curl -sL -o /usr/local/bin/git-bug \
            https://github.com/git-bug/git-bug/releases/download/v0.10.1/git-bug_linux_amd64
          chmod +x /usr/local/bin/git-bug
          git-bug version

      - name: Configure bridge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Each CI run is a fresh clone so we must always run bridge new.
          # On first run (after identity cleanup) this creates one
          # "github-actions" identity.  On subsequent runs, the identity
          # refs fetched above let FinishConfig() find and reuse it via
          # GitHub login metadata -- no new identity is created.
          git-bug bridge new \
            --name=github \
            --target=github \
            --owner="${GITHUB_REPOSITORY_OWNER}" \
            --project="${GITHUB_REPOSITORY#*/}" \
            --token="$GH_TOKEN" \
            --non-interactive

      - name: Pull issues from GitHub
        run: git-bug bridge pull github

      - name: Push git-bug refs to origin
        run: |
          git push origin 'refs/bugs/*:refs/bugs/*'
          git push origin 'refs/identities/*:refs/identities/*'
