name: Update Bibliography

on:
  schedule:
    # Run daily at 3:22 AM UTC
    - cron: '22 3 * * *'
  workflow_dispatch:  # Allow manual trigger
  push:
    branches:
      - master
    paths:
      - 'code/**'
      - '.github/workflows/update-bibliography.yml'

jobs:
  update:
    runs-on: ubuntu-latest
    # Cap the whole job well under GitHub's 6h default so a single wedged
    # network call cannot burn the full budget. Individual steps below have
    # their own tighter timeouts.
    timeout-minutes: 240

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for proper git operations

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        timeout-minutes: 15
        run: |
          # bibtexparser pre-release must be installed first -- using
          # --prerelease=allow globally pulls httpx 1.0.dev3 which breaks
          # pyzotero (missing AsyncBaseTransport).
          uv pip install --system 'bibtexparser>=2.0.0b7'
          uv pip install --system datalad git-annex 'citations-collector>=0.2.3' -r requirements.txt

      - name: Fetch bibliography from DANDI API
        timeout-minutes: 20
        run: |
          cd code
          ./get-bibliography \
            --bibtype bibtex \
            --bibfile ../dandi.bib \
            --results ../cache/results.json

      - name: Fetch RIS bibliography from DANDI API
        timeout-minutes: 20
        run: |
          cd code
          ./get-bibliography \
            --bibtype ris \
            --bibfile ../dandi.ris

      - name: Update README statistics
        timeout-minutes: 5
        run: |
          cd code
          ./update-readme-stats

      - name: Check for changes
        id: check_changes
        run: |
          if git diff --quiet dandi.bib dandi.ris README.md cache/results.json; then
            echo "changes=false" >> $GITHUB_OUTPUT
          else
            echo "changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit bibliography changes
        if: steps.check_changes.outputs.changes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dandi.bib dandi.ris README.md cache/results.json
          git commit -m "Update bibliography from DANDI API

          Updated by automated workflow on $(date -u +"%Y-%m-%d %H:%M:%S UTC")

          🤖 Generated with GitHub Actions"

      # Push the bibliography commit BEFORE running the (flakier) citations
      # refresh below so bib updates always land, even if Refresh stalls or
      # gets killed by the job timeout.
      - name: Push bibliography changes
        if: steps.check_changes.outputs.changes == 'true'
        timeout-minutes: 5
        run: git push

      - name: Sync to Zotero (optional)
        if: steps.check_changes.outputs.changes == 'true' && vars.ENABLE_ZOTERO_SYNC == 'true'
        timeout-minutes: 20
        env:
          ZOTERO_API_KEY: ${{ secrets.ZOTERO_API_KEY }}
          ZOTERO_GROUP_ID: ${{ vars.ZOTERO_GROUP_ID }}
          ZOTERO_COLLECTION_KEY: ${{ vars.ZOTERO_COLLECTION_KEY }}
        run: |
          cd code
          ./update-zotero-collection \
            --api-key "$ZOTERO_API_KEY" \
            --group-id "$ZOTERO_GROUP_ID" \
            --collection-key "$ZOTERO_COLLECTION_KEY" \
            --bib-file ../dandi.bib \
            --cache-file ../cache/zotero_cache.json

      # Bounded, best-effort: citations-collector `discover` has been stalling
      # on CrossRef Event Data queries (see citations/dandi-full.yaml comment).
      # We now cap this step at 100 minutes and treat failure as non-fatal so
      # it can't block bibliography updates. If it fails, subsequent
      # `git annex sync --content && git push` becomes a no-op.
      - name: Refresh citations collection
        if: steps.check_changes.outputs.changes == 'true'
        continue-on-error: true
        timeout-minutes: 100
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          cd citations
          datalad run -m "Refresh citations" make

      - name: Sync git-annex and push citations changes
        if: steps.check_changes.outputs.changes == 'true'
        timeout-minutes: 20
        run: |
          git annex sync --content
          git push
