[build-system]
requires = ["setuptools>=45"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
# Exclude directories that are not Python packages
exclude = ["cache*", ".tox*", ".npm*"]

[project]
name = "dandi-bib"
version = "0.1.0"
description = "Bibliography management for DANDI Archive"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "DANDI Developers"}
]
dependencies = [
    "bibtexparser",
    "pyzotero",
    "requests",
    "urllib3",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-mock>=3.10",
    "pytest-timeout>=2.0",
    "responses>=0.23",
]
devel = [
    # Include test dependencies
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-mock>=3.10",
    "pytest-timeout>=2.0",
    "responses>=0.23",
    # Code quality tools
    "ruff>=0.1.0",
    "mypy>=1.0",
    "types-requests",
    # Test automation
    "tox>=4.0",
    "tox-uv>=1.0",
    "tox-gh-actions>=3.0",
]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "-v",
]
timeout = 30  # Maximum 30 seconds per test
markers = [
    "integration: marks tests as integration tests (deselect with '-m \"not integration\"')",
    "ai_generated: marks tests as AI-generated for tracking purposes",
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "requires_api: marks tests that require external API access",
]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.coverage.run]
source = ["code"]
omit = [
    "tests/*",
    "*/__pycache__/*",
    "*/site-packages/*",
]

[tool.coverage.report]
# Lines to exclude from coverage reporting
exclude_lines = [
    "pragma: no cover",              # Explicit exclusion marker
    "def __repr__",                  # String representations rarely need testing
    "raise AssertionError",          # Defensive programming, should never execute
    "raise NotImplementedError",     # Abstract methods/interface definitions
    "if __name__ == .__main__.:",   # Script entry points (tested via integration)
    "if TYPE_CHECKING:",             # Type checking imports only used by mypy
    "class .*\\bProtocol\\):",       # Protocol definitions (structural types)
    "@(abc\\.)?abstractmethod",      # Abstract method decorators
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in argument defaults
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["E402"]  # Allow imports not at top in tests

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_equality = true
